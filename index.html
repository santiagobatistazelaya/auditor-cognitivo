<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditor Cognitivo</title>
    <!-- CDN oficial de Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; color: #333; }
        textarea { width: 100%; height: 150px; margin-bottom: 10px; padding: 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        button { padding: 12px 24px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #999; cursor: not-allowed; }
        .graficos-container { display: flex; flex-direction: column; gap: 40px; margin-top: 30px; }
        .tarjeta-grafico { background: #f8f9fa; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        canvas { max-width: 100%; }
    </style>
</head>
<body>

    <h1>Auditor Cognitivo de Copywriting</h1>
    <p>Pegá tu texto publicitario para analizar su rendimiento y flujo de retención.</p>
    
    <textarea id="texto-anuncio" placeholder="Escribí o pegá tu campaña publicitaria acá..."></textarea>
    <button onclick="auditarCopy()" id="btn-auditar">Auditar Campaña</button>
    <p id="mensaje-estado" style="color: #666; font-weight: bold; margin-top: 15px;"></p>

    <div class="graficos-container">
        <!-- Tarjeta Freemium -->
        <div class="tarjeta-grafico">
            <h3>Flujo de Atención (Cartesiano)</h3>
            <canvas id="graficoCartesiano"></canvas>
        </div>

        <!-- Tarjeta Premium (Perfil) -->
        <div class="tarjeta-grafico">
            <h3>Perfil Psicológico Completo (Radial)</h3>
            <canvas id="graficoRadial"></canvas>
        </div>
    </div>

    <script>
        let chartCartesiano = null;
        let chartRadial = null;

        async function auditarCopy() {
            const texto = document.getElementById('texto-anuncio').value;
            const estado = document.getElementById('mensaje-estado');
            const btn = document.getElementById('btn-auditar');

            if (!texto) {
                alert('Por favor, ingresá un texto para auditar.');
                return;
            }

            estado.innerText = "Procesando métricas... (esto puede tardar unos segundos)";
            btn.disabled = true;

            try {
                // Acá es donde tu HTML llama al motor que subimos a Vercel
                const response = await fetch('/api/analizar-copy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto: texto })
                });

                if (!response.ok) {
                    throw new Error("Error en el servidor o API no encontrada.");
                }

                const data = await response.json();
                
                // Si todo sale bien, mandamos los datos a dibujar
                dibujarGraficos(data);
                estado.innerText = "¡Análisis completado!";
                
            } catch (error) {
                console.error('Detalle del error:', error);
                estado.innerText = "Hubo un error al procesar la solicitud.";
            } finally {
                btn.disabled = false;
            }
        }

        function dibujarGraficos(data) {
            // Destruimos gráficos anteriores si el usuario hace varias auditorías seguidas
            if (chartCartesiano) chartCartesiano.destroy();
            if (chartRadial) chartRadial.destroy();

            // 1. Dibujar Gráfico Cartesiano
            const ctxCartesiano = document.getElementById('graficoCartesiano').getContext('2d');
            chartCartesiano = new Chart(ctxCartesiano, {
                type: 'line',
                data: {
                    labels: ['Inicio', 'Desarrollo', 'Cierre'],
                    datasets: [{
                        label: 'Nivel de Retención (1 al 10)',
                        data: [
                            data.grafico_cartesiano.inicio,
                            data.grafico_cartesiano.desarrollo,
                            data.grafico_cartesiano.cierre
                        ],
                        borderColor: '#007bff',
                        backgroundColor: 'rgba(0, 123, 255, 0.2)',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 6
                    }]
                },
                options: { scales: { y: { min: 0, max: 10 } } }
            });

            // 2. Dibujar Gráfico Radial
            const ctxRadial = document.getElementById('graficoRadial').getContext('2d');
            chartRadial = new Chart(ctxRadial, {
                type: 'radar',
                data: {
                    labels: [
                        'Emociones (Ekman)', 
                        'Reacción Afectiva (Zajonc)', 
                        'Motivación Intrínseca', 
                        'Teoría de la Mente', 
                        'Claridad Cognitiva'
                    ],
                    datasets: [{
                        label: 'Puntuación Cognitiva',
                        data: [
                            data.grafico_radial.emociones_universales,
                            data.grafico_radial.reaccion_afectiva,
                            data.grafico_radial.motivacion_intrinseca,
                            data.grafico_radial.teoria_de_la_mente,
                            data.grafico_radial.claridad
                        ],
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        borderColor: '#ff6384',
                        pointBackgroundColor: '#ff6384',
                        pointRadius: 5
                    }]
                },
                options: { 
                    scales: { r: { min: 0, max: 10 } },
                    elements: { line: { borderWidth: 2 } }
                }
            });
        }
    </script>
</body>
</html>
